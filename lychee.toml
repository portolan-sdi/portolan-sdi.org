# This repo's link-check exceptions. The org rules live in portolan-ops
# lychee/org.toml. URL exceptions live in .lycheeignore.
exclude_path = [
  # Static design sketches. Their navigation uses placeholder anchors, and
  # no page links to them.
  '(^|/)design-mockups/',
]

# A link to a directory, such as /#how, resolves to its index.html, so the
# check can find the anchor. "." keeps a directory without an index valid.
index_files = ["index.html", "."]
