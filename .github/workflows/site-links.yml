# Checks the relative links in the built site.
#
# links.yml checks the Markdown and MDX sources. Links in components,
# layouts, and generated pages exist only after the build. Next.js keeps
# the built pages under .next/ in a layout that does not match the URLs,
# so this job starts the production server and saves a copy of each page
# at its URL path. The copy starts from sitemap.xml and follows every
# internal link. A link to a page that does not exist leaves no file, and
# the offline check in portolan-ops reusable-links.yml reports it.
name: Site links

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mirror:
    name: Build and copy the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.12.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Copy each page at its URL path
        run: |
          pnpm start > next.log 2>&1 &
          timeout 60 bash -c \
            'until curl -sf -o /dev/null http://localhost:3000/; do sleep 1; done'
          # The sitemap lists the canonical host. Fetch the same paths
          # from the local server.
          curl -sf http://localhost:3000/sitemap.xml \
            | grep -o '<loc>[^<]*</loc>' \
            | sed -e 's#<loc>https\?://[^/<]*#http://localhost:3000#' \
                  -e 's#</loc>##' > urls.txt
          mkdir site
          cd site
          # wget exits 8 when the server answers with an error, such as a
          # 404 for a broken link. The link check reports those, so only
          # other exit codes fail this step.
          status=0
          wget --no-verbose --recursive --level=inf --page-requisites \
            --adjust-extension --no-host-directories -e robots=off \
            --input-file=../urls.txt http://localhost:3000/ || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 8 ]; then
            exit "$status"
          fi
          # wget keeps a query string in the file name, for example
          # favicon.ico?v=1. A link resolves to the name without it.
          find . -type f -name '*\?*' | while read -r f; do
            mv "$f" "${f%%\?*}"
          done

      - name: Show the server log
        if: failure()
        run: cat next.log

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-site
          path: site
          retention-days: 7

  site-links:
    needs: mirror
    uses: portolan-sdi/portolan-ops/.github/workflows/reusable-links.yml@v1
    permissions:
      contents: read
      # The reusable job declares issues: write for its weekly mode. A
      # caller must grant at least that, even though this mode never
      # writes an issue.
      issues: write
    with:
      site-artifact: built-site
